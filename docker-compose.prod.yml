# ==============================================================================
# Votexa Production Docker Compose Orchestration
# High-Availability Stack: PostgreSQL 16 + Node.js API + Nginx Reverse Proxy
# ==============================================================================

version: '3.8'

networks:
  votexa-internal:
    driver: bridge
  votexa-public:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  votexa_logs:
    driver: local

services:
  # ----------------------------------------------------------------------------
  # Database Service: PostgreSQL 16
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: votexa-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-votexa_prod}
      POSTGRES_USER: ${POSTGRES_USER:-votexa_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/src/database/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - votexa-internal
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-votexa_admin} -d ${POSTGRES_DB:-votexa_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G

  # ----------------------------------------------------------------------------
  # Backend API Service: Node.js Express App
  # ----------------------------------------------------------------------------
  votexa-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: votexa-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-votexa_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-votexa_prod}?sslmode=prefer
    volumes:
      - votexa_logs:/app/logs
    networks:
      - votexa-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ----------------------------------------------------------------------------
  # Edge Reverse Proxy: Nginx
  # ----------------------------------------------------------------------------
  votexa-web:
    image: nginx:1.25-alpine
    container_name: votexa-web
    restart: always
    depends_on:
      - votexa-api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./client/dist:/usr/share/nginx/html:ro
    networks:
      - votexa-internal
      - votexa-public
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

